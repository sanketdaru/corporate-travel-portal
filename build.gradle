plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.corporate.travel'
    version = '0.1.0'
    
    repositories {
        mavenCentral()
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

subprojects {
    if (buildFile.exists()) {
        apply plugin: 'java-library'
        apply plugin: 'io.spring.dependency-management'
        
        dependencyManagement {
            imports {
                mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.11"
                mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.1"
            }
            
            dependencies {
                // Common versions
                dependency 'io.opentelemetry:opentelemetry-api:1.32.0'
                dependency 'com.networknt:json-schema-validator:1.0.87'
                
                // Flyway version alignment - Fix version mismatch between core and database-specific modules
                dependency 'org.flywaydb:flyway-core:10.17.0'
                dependency 'org.flywaydb:flyway-database-postgresql:10.17.0'
            }
        }
        
        dependencies {
            implementation 'org.slf4j:slf4j-api'

            // Lombok for reducing boilerplate
            compileOnly 'org.projectlombok:lombok'
            annotationProcessor 'org.projectlombok:lombok'
            
            // Testing
            testImplementation 'org.springframework.boot:spring-boot-starter-test'
            testImplementation 'org.junit.jupiter:junit-jupiter'
        }
        
        // tasks.withType(Test) {
        //     useJUnitPlatform()
        // }
    }
}
