name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Gradle build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: services/**/build/reports/tests/
          retention-days: 7

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/nextjs
    env:
      # Build-time placeholders only; real values come from the runtime environment.
      AUTH_SECRET: ci-build-placeholder
      KEYCLOAK_CLIENT_ID: employee-portal
      KEYCLOAK_ISSUER: http://localhost:8080/realms/corporate-travel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/nextjs/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  keycloak-realm:
    name: Keycloak realm-as-code (apply, idempotency, claims)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate realm config against a throwaway Keycloak
        run: ./scripts/keycloak-realm-test/validate-realm-config.sh

  scripts:
    name: Shell scripts (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bash -n
        run: find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
