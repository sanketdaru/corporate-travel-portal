spring:
  application:
    name: delegation-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/corporate_travel
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: delegation
        format_sql: true
    show-sql: false
  
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password123
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: delegation
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/corporate-travel
          jwk-set-uri: http://localhost:8080/realms/corporate-travel/protocol/openid-connect/certs

server:
  port: 8083

# OPA Configuration
opa:
  url: http://localhost:8181

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Logging
logging:
  level:
    root: INFO
    com.corporate.travel.delegation: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.neo4j.driver: DEBUG

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always