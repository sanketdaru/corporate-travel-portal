spring:
  # Boot 4: server.error.* moved to spring.web.error.*
  web:
    error:
      include-message: always
      include-binding-errors: always
      include-stacktrace: on_param
      include-exception: false
  application:
    name: expense-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/corporate_travel
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver
    
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    locations: classpath:db/migration
    schemas: expense
    create-schemas: true
    
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: expense
        format_sql: true
    show-sql: false
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/corporate-travel
          # Reject tokens not issued for this service (RFC 7519 aud); see docs/UPGRADE-PLAN.md Phase 4
          audiences:
            - expense-service

server:
  port: 8082

# OPA Configuration
opa:
  url: http://opa:8181

# Internal service URLs (container network — no gateway)
travel-service:
  url: http://localhost:8081

# Logging
logging:
  level:
    root: INFO
    com.corporate.travel: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: DEBUG

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    enabled: false  # Disabled - use API Gateway Swagger UI instead
  show-actuator: true
