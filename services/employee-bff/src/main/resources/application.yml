spring:
  application:
    name: employee-bff

  # Delegation grant store (ADR-024) — schema "bff", managed by Flyway
  datasource:
    url: jdbc:postgresql://localhost:5432/corporate_travel
    username: admin
    password: admin123
  flyway:
    schemas: bff
    create-schemas: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/corporate-travel
          # Reject tokens not issued for this service (RFC 7519 aud); see docs/UPGRADE-PLAN.md Phase 4
          audiences:
            - employee-bff
          jwk-set-uri: http://localhost:8080/realms/corporate-travel/protocol/openid-connect/certs

server:
  port: 8085

keycloak:
  url: http://localhost:8080
  # Browser-facing Keycloak URL for the delegation grant redirect (differs from url inside containers)
  public-url: http://localhost:8080
  realm: corporate-travel
  client-id: employee-bff
  client-secret: bff-service-secret-change-in-production

delegation:
  grant:
    # Confidential client used only for the delegator's grant sign-in (offline_access + delegation:user)
    client-id: delegation-grant
    client-secret: delegation-grant-secret-change-in-production
    # Registered on delegation-grant; reaches the BFF through the Next.js /api/bff rewrite
    redirect-uri: http://localhost:3000/api/bff/delegation/grant/callback
    # Where the browser lands after the grant completes (?grant=success|error&delegationId=...)
    return-url: http://localhost:3000/delegation
    # AES-256-GCM key (base64, 32 bytes) for offline tokens at rest. DEMO KEY — override in any real deployment.
    encryption-key: K9I0s1jbgA7DM/sfcm7bhvgAwpn2w90k61O85nvfyvQ=

services:
  travel-service-url: http://localhost:8081
  expense-service-url: http://localhost:8082
  delegation-service-url: http://localhost:8083
  consent-service-url: http://localhost:8084

opa:
  url: http://localhost:8181

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Logging
logging:
  level:
    root: INFO
    com.corporate.travel.bff: DEBUG
    org.springframework.security: DEBUG

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
