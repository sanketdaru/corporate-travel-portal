dependencies {
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    api 'org.springframework.boot:spring-boot-starter-webmvc'
    api 'org.springframework.boot:spring-boot-starter-validation'
    
    
    // RestClient for calls to OPA and other services
    api 'org.springframework.boot:spring-boot-starter-restclient'
    
    // Lombok - need to explicitly enable annotation processor
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Library module (no Boot plugin), so the JUnit Platform launcher must be declared explicitly
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
test {
    useJUnitPlatform()
}
