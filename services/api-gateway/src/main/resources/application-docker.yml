spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/corporate-travel
          jwk-set-uri: http://keycloak:8080/realms/corporate-travel/protocol/openid-connect/certs

# Service URLs in Docker network
# Routes use service names defined in docker-compose.yml

logging:
  level:
    root: INFO
    com.corporate.travel.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
