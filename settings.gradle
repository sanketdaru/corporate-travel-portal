plugins {
    // Downloads the Java toolchain (see build.gradle) when no matching local JDK exists
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'corporate-travel-portal'

// Shared libraries
include 'services:shared:security-commons'
include 'services:shared:domain-models'
//include 'services:shared:observability'

// Microservices
include 'services:api-gateway'
include 'services:travel-service'
include 'services:expense-service'
//include 'services:approval-service'
include 'services:consent-service'
include 'services:delegation-service'
include 'services:employee-bff'
