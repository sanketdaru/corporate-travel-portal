  #     - corporate-travel-network

  # Delegation Service
  delegation-service:
    build:
      context: .
      dockerfile: services/delegation-service/Dockerfile
    container_name: corporate-travel-delegation-service
    platform: linux/amd64
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/corporate_travel
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: password123
      KEYCLOAK_URL: http://keycloak:8080
      OPA_URL: http://opa:8181
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: http://localhost:8080/realms/corporate-travel
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/corporate-travel/protocol/openid-connect/certs
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      opa:
        condition: service_healthy
    networks:
      - corporate-travel-network
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Employee BFF
  employee-bff:
    build:
      context: .
      dockerfile: services/employee-bff/Dockerfile
    container_name: corporate-travel-employee-bff
    platform: linux/amd64
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KEYCLOAK_URL: http://keycloak:8080
      SERVICES_TRAVEL_SERVICE_URL: http://travel-service:8081
      SERVICES_EXPENSE_SERVICE_URL: http://expense-service:8082
      SERVICES_DELEGATION_SERVICE_URL: http://delegation-service:8083
      SERVICES_CONSENT_SERVICE_URL: http://consent-service:8084
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: http://localhost:8080/realms/corporate-travel
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/corporate-travel/protocol/openid-connect/certs
    ports:
      - "8085:8085"
    depends_on:
      keycloak:
        condition: service_healthy
      travel-service:
        condition: service_healthy
      expense-service:
        condition: service_healthy
      delegation-service:
        condition: service_healthy
      consent-service:
        condition: service_healthy
    networks:
